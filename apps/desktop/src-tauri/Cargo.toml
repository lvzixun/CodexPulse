[package]
name = "codexpulse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A quiet desktop companion for Codex usage and resets"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pulse-core = { path = "../../../crates/pulse-core" }
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
notify = "8"
walkdir = "2"
iana-time-zone = "0.1"
tokio = { version = "1", features = ["sync", "time"] }
ureq = { version = "3.4", default-features = false, features = ["rustls", "socks-proxy"] }
base64 = "0.22"
toml = "1"
url = "2"
semver = "1"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["socks"] }

[dev-dependencies]
tempfile.workspace = true
minisign-verify = "0.2.5"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Globalization", "Win32_Security", "Win32_System_Memory", "Win32_System_DataExchange"] }

[target.'cfg(target_os = "macos")'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["platform-verifier"] }
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "NSProcessInfo", "NSLocale", "NSArray", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSApplication", "NSAccessibility", "NSWindow", "NSView", "NSImage", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSCell", "NSFont", "NSFontDescriptor", "NSPasteboard", "NSAppearance", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-service-management = { version = "=0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
plist = "=1.10.1"

[target.'cfg(target_os = "macos")'.dependencies.objc2-quartz-core]
version = "0.3.2"
default-features = false
features = ["std", "CALayer"]
