name: Release build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or commit to build (empty uses the selected branch)
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Match the locally verified compiler instead of changing lints per runner date.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            args: ''
            path: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
          - os: macos-latest
            artifact: macos-universal
            args: '--target universal-apple-darwin'
            path: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.97.1'
          components: clippy,rustfmt
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --test apps/desktop/test/*.test.ts
      - run: node --test scripts/release-manifest.test.cjs
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Verify Windows x64 application and installer versions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $app = Get-Item target/release/codexpulse.exe
          $bytes = [System.IO.File]::ReadAllBytes($app.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550 -or
              [BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw 'Application is not a Windows x64 PE executable'
          }
          $installers = @(Get-ChildItem target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          foreach ($file in @($app, $installers[0])) {
            $version = $file.VersionInfo.ProductVersion
            if ($version -notin @($expected, "$expected.0")) {
              throw "Unexpected product version: $version"
            }
          }
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash
          Write-Output "Verified Windows x64 version $expected; installer SHA256 $hash"
      - name: Verify universal application and ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          APP=target/universal-apple-darwin/release/bundle/macos/CodexPulse.app
          codesign --verify --deep --strict "$APP"
          lipo "$APP/Contents/MacOS/codexpulse" -verify_arch arm64 x86_64
      - name: Verify updater package signature
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo run --release --locked -p codexpulse --example verify-update -- target/release/bundle/nsis/*.exe
          else
            cargo run --release --locked -p codexpulse --example verify-update -- target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7
