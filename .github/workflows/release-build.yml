name: Release build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or commit to build (empty uses the selected branch)
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            args: ''
            path: target/release/bundle/nsis/*.exe
          - os: macos-latest
            artifact: macos-universal
            args: '--target universal-apple-darwin'
            path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --test apps/desktop/test/*.test.ts
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm build ${{ matrix.args }}
      - name: Verify universal application and ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          APP=target/universal-apple-darwin/release/bundle/macos/CodexPulse.app
          codesign --verify --deep --strict "$APP"
          lipo "$APP/Contents/MacOS/codexpulse" -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7
