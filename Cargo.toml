[workspace]
members = ["crates/pulse-core", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
