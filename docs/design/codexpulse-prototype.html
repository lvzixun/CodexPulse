#cp-prototype .cp-model-detail {background:var(--cp-soft);padding:12px;border-radius:12px;margin-top:8px}
#cp-prototype .cp-model-detail .cp-metrics strong {font-size:15px}
#cp-prototype .cp-note {font-size:11px;color:var(--cp-muted);line-height:1.7;margin:14px 0 0}
#cp-prototype .cp-session-list {margin-top:9px}
#cp-prototype .cp-sessionrow {display:flex;flex-direction:column;gap:3px;width:100%;padding:11px 12px!important;text-align:left;border-radius:11px;margin:4px 0}
#cp-prototype .cp-sessionrow[aria-pressed=true] {background:var(--cp-soft)}
#cp-prototype .cp-sessionrow>span {display:flex;justify-content:space-between;gap:8px}
#cp-prototype .cp-sessionrow>span:first-child {font-size:12px;font-weight:500}
#cp-prototype .cp-sessionrow>span:last-child {font-size:11px;color:var(--cp-muted)}
#cp-prototype .cp-detail {margin-top:17px;padding-top:15px;border-top:1px solid var(--cp-line)}
#cp-prototype .cp-detail .cp-metrics {row-gap:14px;margin-top:14px}
#cp-prototype .cp-detail .cp-metrics strong {font-size:16px}
#cp-prototype .cp-method {padding:10px 12px;background:var(--cp-soft);border-radius:10px;font-size:11px;color:var(--cp-muted)}

#cp-prototype .cp-news-item {margin-top:15px;padding:15px;background:var(--cp-soft);border-radius:13px}

#cp-prototype .cp-news-item p {font-size:12px;margin:5px 0 8px}
#cp-prototype .cp-tag {font-size:11px;color:var(--cp-amber)}
#cp-prototype .cp-success {color:var(--cp-accent)}
#cp-prototype .cp-setting {display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;font-size:13px}
#cp-prototype .cp-setting select {font:inherit;font-size:12px;color:var(--cp-text);background:var(--cp-solid);border:1px solid var(--cp-line);border-radius:8px;padding:6px 8px;max-width:160px}
#cp-prototype input {accent-color:var(--cp-accent);width:17px;height:17px}

@media(max-width:440px) {#cp-prototype .cp-scene {padding:66px 10px 70px;min-height:820px}#cp-prototype .cp-mount {min-height:676px}#cp-prototype .cp-body {padding:17px 15px}#cp-prototype .cp-header {padding:15px 14px 11px;gap:6px}#cp-prototype .cp-icon {width:28px;height:28px}#cp-prototype .cp-source {padding-left:15px!important;padding-right:15px!important}#cp-prototype .cp-tabs {margin:0 12px}#cp-prototype .cp-quota {gap:15px}#cp-prototype .cp-summary {padding:12px}#cp-prototype .cp-total>strong {font-size:29px}#cp-prototype .cp-total>strong>span {font-size:11px}#cp-prototype .cp-compact {padding:16px!important}#cp-prototype .cp-footer {padding-left:15px;padding-right:15px}#cp-prototype .cp-taskbar>span:first-child {display:none}#cp-prototype .cp-sectionhead {gap:5px;flex-wrap:wrap}#cp-prototype .cp-metrics {gap:7px}#cp-prototype .cp-metrics strong {font-size:15px}#cp-prototype .cp-chart {gap:3px}#cp-prototype .cp-compact-bottom>span:first-child {font-size:11px}}
@media(pointer:coarse) {#cp-prototype .cp-icon {min-width:40px;min-height:44px}#cp-prototype .cp-header {gap:4px}#cp-prototype .cp-logo {width:24px;height:27px}#cp-prototype .cp-brand strong {font-size:14px}#cp-prototype .cp-tabs button,#cp-prototype .cp-textbutton,#cp-prototype .cp-taskbar button {min-height:44px}#cp-prototype .cp-setting select {font-size:16px}#cp-prototype .cp-source {min-height:44px;padding-bottom:8px!important}}
@media(prefers-reduced-motion:reduce) {#cp-prototype .cp-shell {transition:none}}
</style>
<script>
(() => {
const root=document.getElementById('cp-prototype');
const modelData=[{id:'gpt-5.4',name:'GPT-5.4',input:10000000,cached:7000000,output:1200000,sessions:40,rates:[2.5,.25,15]},{id:'gpt-5.4-mini',name:'GPT-5.4 Mini',input:5000000,cached:3000000,output:800000,sessions:26,rates:[.75,.075,4.5]},{id:'gpt-5.3-codex',name:'GPT-5.3-Codex',input:3000000,cached:2000000,output:400000,sessions:18,rates:[1.75,.175,14]}];
const sessions=[{id:'collector',title:'实现 CodexPulse 数据采集',model:'gpt-5.4',input:126400,cached:88480,output:19200,source:'cli',active:true,time:'14:35'},{id:'tray',title:'调整托盘面板交互',model:'gpt-5.4-mini',input:64000,cached:51200,output:8400,source:'app',active:false,time:'13:58'},{id:'tests',title:'检查额度去重逻辑',model:'gpt-5.3-codex',input:30400,cached:18240,output:4600,source:'cli',active:false,time:'12:41'}];
const getModel=id=>modelData.find(m=>m.id===id), cost=(d,m)=>((d.input-d.cached)*m.rates[0]+d.cached*m.rates[1]+d.output*m.rates[2])/1e6, money=(d,n=2)=>'$'+d.toFixed(n), compact=n=>n>=1e6?(n/1e6).toFixed(1)+'M':(n/1000).toFixed(1)+'K', number=n=>n.toLocaleString('en-US');
const baseView=open=>({open,page:'overview',model:null,session:'collector',scope:null,method:false,original:false});
const defaults=()=>({version:6,theme:'auto',windowsFloat:true,pinned:true,app:true,cli:true,generating:true,blur:26,radius:24,views:{float:baseView(false),mac:baseView(false)}});
const restore=s=>{const p=s?.privateContent;if(![4,5,6].includes(p?.version))return defaults();const d=defaults();return {...d,...p,version:6,views:Object.fromEntries(Object.keys(d.views).map(k=>[k,{...d.views[k],...p.views?.[k]}]))}};
let state=restore(window.openai?.widgetState);
let trayMenuOpen=false,windowsRunning=true;
for(const scene of root.querySelectorAll('[data-instance]')) {const fragment=root.querySelector('template').content.cloneNode(true);scene.querySelector('.cp-mount').append(fragment);scene.querySelector('.cp-shell').id='cp-'+scene.dataset.instance;}
const weights=[3,5,4,8,6,2,1,4,7,10,8,5,2,3,6,9,12,7,4,1,3,6,8,11,9,5,3,4,7,8],sum=weights.reduce((a,b)=>a+b,0);
for(const chart of root.querySelectorAll('[data-chart]')) chart.innerHTML=weights.map((w,i)=>{const amount=20400000*w/sum;const date=new Date(Date.UTC(2026,8,7+i));return `<span style="height:${amount/1500000*100}%" data-tooltip="${date.getUTCMonth()+1}/${date.getUTCDate()} · ${compact(amount)} tokens"></span>`}).join('');
function save(){try{window.openai?.setWidgetState({modelContent:{product:'CodexPulse',windowsEntry:'浮窗和托盘单击共用同一个详情窗口；托盘右键仅设置与退出',windowsFloat:state.windowsFloat,macEntry:'仅菜单栏图标，点击展开面板',theme:state.theme,platforms:'Windows 首发，macOS 后续',modelSummary:'所有模型总计 + 每模型分类',expanded:state.views.float.open},privateContent:state})?.catch(()=>{});}catch{}}
function speed(session){return session?.active&&state.cli&&state.generating?'48.6':'—'}
function render(){
root.style.colorScheme=state.theme==='auto'?'inherit':state.theme;root.style.setProperty('--cp-blur',state.blur+'px');root.style.setProperty('--cp-radius',state.radius+'px');
for(const scene of root.querySelectorAll('[data-instance]')) {
const instance=scene.dataset.instance,view=state.views[instance],shell=scene.querySelector('.cp-shell'),mac=instance==='mac';
const floating=instance==='float'&&state.windowsFloat;
shell.hidden=(!mac&&!windowsRunning)||(!view.open&&!floating);shell.classList.toggle('is-open',view.open);shell.querySelector('.cp-compact').hidden=view.open||!floating;shell.querySelector('.cp-expanded').hidden=!view.open;shell.querySelector('[data-action=open]').setAttribute('aria-expanded',String(view.open));
shell.setAttribute('aria-label',mac?'CodexPulse 菜单栏面板':view.open?'CodexPulse 详情窗口':'CodexPulse 毛玻璃浮窗');
scene.classList.toggle('cp-tray-mode',instance==='float'&&!state.windowsFloat);
if(instance==='float'){scene.querySelector('[data-entry-label]').textContent=!windowsRunning?'Windows · CodexPulse 已退出':state.windowsFloat?'Windows · 浮窗与托盘共用详情':'Windows · 通过托盘打开详情';scene.querySelector('.cp-tray-menu').hidden=!trayMenuOpen||!windowsRunning;scene.querySelector('[data-launch=float]').hidden=!windowsRunning;scene.querySelector('[data-action=restart]').hidden=windowsRunning;}
if(mac){const launcher=scene.querySelector('[data-launch=mac]');launcher.setAttribute('aria-expanded',String(view.open));launcher.setAttribute('aria-label',view.open?'关闭 CodexPulse 菜单栏面板':'打开 CodexPulse 菜单栏面板');}
for(const el of shell.querySelectorAll('[data-windows-only]'))el.hidden=mac;
shell.querySelector('[data-setting=pinned]').disabled=!state.windowsFloat;
const closeLabel=floating?'收起详情':'关闭面板';for(const button of shell.querySelectorAll('[data-action=close]')){button.setAttribute('aria-label',closeLabel);button.innerHTML=(button.closest('.cp-footer')?closeLabel+' ':'')+'<i data-lucide="'+(floating?'chevron-up':'x')+'" aria-hidden="true"></i>';}
for(const el of shell.querySelectorAll('[data-speed]')) el.innerHTML=speed(sessions[0])==='—'?'—':el.closest('.cp-compact')?'48.6 tok/s':'48.6 <small>tok/s</small>';
shell.querySelector('[data-live]').textContent=!state.cli?'未连接':state.generating?'生成中':'空闲';
shell.querySelector('[data-current-source]').textContent=mac?'· CLI':'· WSL';shell.querySelector('[data-current-model]').textContent=(mac?'CLI':'WSL')+' · GPT-5.4';
const sources=[];if(state.app)sources.push(mac?'macOS App':'Windows App');if(state.cli)sources.push(mac?'CLI':'WSL');shell.querySelector('[data-source]').textContent=sources.length?sources.join(' + ')+' · 同一账号':'尚未连接采集来源';
for(const panel of shell.querySelectorAll('[data-page]'))panel.hidden=panel.dataset.page!==view.page;
for(const tab of shell.querySelectorAll('[data-tab]'))tab.setAttribute('aria-pressed',String(tab.dataset.tab===view.page));
shell.querySelector('[data-action=pin]').setAttribute('aria-pressed',String(state.pinned));shell.querySelector('[data-action=pin]').hidden=!floating;
for(const input of shell.querySelectorAll('[data-setting]')) {const key=input.dataset.setting;if(input.type==='checkbox')input.checked=state[key];else input.value=state[key];}
shell.querySelector('[data-app-label]').textContent=mac?'macOS Codex App':'Windows Codex App';shell.querySelector('[data-cli-label]').textContent=mac?'本机 Codex CLI':'WSL Codex CLI';
shell.querySelector('[data-model-list]').innerHTML=modelData.map(m=>{const selected=view.model===m.id;return `<button class="cp-modelrow cursor-interaction" data-model="${m.id}" aria-expanded="${selected}"><span><strong>${m.name}</strong><small>${m.sessions} sessions</small></span><span><span><b>${compact(m.input+m.output)}</b><br><small>${money(cost(m,m))}</small></span><i data-lucide="${selected?'chevron-up':'chevron-down'}" aria-hidden="true"></i></span></button>${selected?`<div class="cp-model-detail"><div class="cp-metrics"><div><span>输入</span><strong>${compact(m.input)}</strong></div><div><span>其中缓存</span><strong>${compact(m.cached)}</strong></div><div><span>输出</span><strong>${compact(m.output)}</strong></div></div><div class="cp-sectionhead" style="margin-top:12px"><small>当前输出速度 · ${m.id==='gpt-5.4'?speed(sessions[0]):'—'}${m.id==='gpt-5.4'&&speed(sessions[0])!=='—'?' tok/s':''}</small><button class="cp-textbutton cursor-interaction" data-model-sessions="${m.id}">相关 sessions <i data-lucide="arrow-right" aria-hidden="true"></i></button></div></div>`:''}`}).join('');
const visible=sessions.filter(s=>(!view.scope||s.model===view.scope)&&state[s.source]);
if(!visible.some(s=>s.id===view.session))view.session=visible[0]?.id||null;
shell.querySelector('[data-session-scope]').textContent=view.scope?getModel(view.scope).name:'全部模型';shell.querySelector('[data-scope]').hidden=!view.scope;
shell.querySelector('[data-session-list]').innerHTML=visible.length?visible.map(s=>`<button class="cp-sessionrow cursor-interaction" data-session="${s.id}" aria-pressed="${view.session===s.id}"><span><span>${s.title}</span><small>${s.time}</small></span><span><span>${getModel(s.model).name} · ${s.source==='cli'?(mac?'CLI':'WSL'):'App'}</span><span>${s.active&&state.generating?'生成中':'已完成'} · ${compact(s.input+s.output)}</span></span></button>`).join(''):'<p class="cp-note">尚未连接采集来源；连接后显示最近的工作 sessions。</p>';
const session=sessions.find(s=>s.id===view.session),m=session&&getModel(session.model);
shell.querySelector('[data-session-detail]').innerHTML=session?`<div class="cp-detail"><div class="cp-sectionhead"><span>Session 用量</span><small>${m.name}</small></div><div class="cp-metrics"><div><span>总 tokens</span><strong>${number(session.input+session.output)}</strong></div><div><span>美元估算</span><strong>${money(cost(session,m),4)}</strong></div><div><span>当前输出速度</span><strong>${speed(session)}${speed(session)!=='—'?'<small> tok/s</small>':''}</strong></div><div><span>输入</span><strong>${number(session.input)}</strong></div><div><span>其中缓存</span><strong>${number(session.cached)}</strong></div><div><span>输出</span><strong>${number(session.output)}</strong></div></div><button class="cp-textbutton cursor-interaction" data-action="method" aria-expanded="${view.method}">估算口径 <i data-lucide="${view.method?'chevron-up':'chevron-down'}" aria-hidden="true"></i></button><div class="cp-method" ${view.method?'':'hidden'}>非缓存输入 × $${m.rates[0]} + 缓存输入 × $${m.rates[1]} + 输出 × $${m.rates[2]}，单价按每百万 tokens。<br>API 等价估算，不代表订阅账单。<br><a href="https://developers.openai.com/api/docs/models/${m.id}" target="_blank" rel="noopener">模型价格参考</a></div></div>`:'';
shell.querySelector('[data-original]').hidden=!view.original;
}
globalThis.lucide?.createIcons({attrs:{width:16,height:16}});
}
root.addEventListener('contextmenu',event=>{if(!event.target.closest('[data-launch=float]'))return;event.preventDefault();trayMenuOpen=true;render();});
root.addEventListener('keydown',event=>{if(event.target.closest('[data-launch=float]')&&(event.key==='ContextMenu'||(event.shiftKey&&event.key==='F10'))){event.preventDefault();trayMenuOpen=true;render();}if(event.key==='Escape'&&trayMenuOpen){trayMenuOpen=false;render();}});
root.addEventListener('pointerdown',event=>{if(trayMenuOpen&&!event.target.closest('.cp-tray-menu')&&!event.target.closest('[data-launch=float]')){trayMenuOpen=false;root.querySelector('.cp-tray-menu').hidden=true;}});
root.addEventListener('click',event=>{const launch=event.target.closest('[data-launch]');if(launch){const id=launch.dataset.launch;trayMenuOpen=false;state.views[id].open=id==='mac'?!state.views[id].open:true;render();save();return;}const el=event.target.closest('button');const scene=el?.closest('[data-instance]');if(!scene)return;const view=state.views[scene.dataset.instance];if(el.dataset.tab)view.page=el.dataset.tab;if(el.dataset.model)view.model=view.model===el.dataset.model?null:el.dataset.model;if(el.dataset.session){view.session=el.dataset.session;view.method=false;}if(el.dataset.modelSessions){view.scope=el.dataset.modelSessions;view.page='sessions';view.method=false;}switch(el.dataset.action){case'open':view.open=true;break;case'close':view.open=false;break;case'pin':state.pinned=!state.pinned;break;case'settings':view.page='settings';break;case'tray-settings':trayMenuOpen=false;view.open=true;view.page='settings';break;case'quit':trayMenuOpen=false;windowsRunning=false;view.open=false;break;case'restart':windowsRunning=true;view.page='overview';break;case'models':view.page='models';break;case'news':view.page='news';break;case'active-session':view.page='sessions';view.session='collector';view.scope=null;break;case'clear-scope':view.scope=null;break;case'method':view.method=!view.method;break;case'original':view.original=!view.original;break;}render();save();});
root.addEventListener('change',event=>{const key=event.target.dataset.setting;if(!key)return;state[key]=event.target.type==='checkbox'?event.target.checked:event.target.value;render();save();});
window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){state=restore(event.detail.globals.widgetState);render();}});
render();
if(globalThis.Tweak)for(const shell of root.querySelectorAll('.cp-shell')) {const tweak=new Tweak({container:shell,onChange:render});tweak.addSlider(state,'blur',{label:'毛玻璃模糊',min:10,max:40,unit:'px'});tweak.addSlider(state,'radius',{label:'圆角',min:14,max:30,unit:'px'});tweak.addToggle(state,'generating',{label:'演示生成中'});}
})();
</script>
